name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      # Root tooling package holds Biome (lint + format). `biome ci` is
      # non-mutating: it fails if anything is unformatted or trips a lint rule.
      - name: Install tooling
        run: bun install --frozen-lockfile
      - name: Biome — lint + format check
        run: bun run ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      # Install in dependency order: vouch-world typechecks into vouch-core's
      # source, and vouch-node typechecks into both — so deps must be present first.
      - name: Install vouch-core
        run: bun install --frozen-lockfile
        working-directory: vouch-core
      - name: Install vouch-world
        run: bun install --frozen-lockfile
        working-directory: vouch-world
      - name: Install vouch-node
        run: bun install --frozen-lockfile
        working-directory: vouch-node
      - name: Install vouch-mcp
        run: bun install --frozen-lockfile
        working-directory: vouch-mcp
      - name: Install vouch-cli
        run: bun install --frozen-lockfile
        working-directory: vouch-cli
      - name: Install vouch-web
        run: bun install --frozen-lockfile
        working-directory: vouch-web

      - name: vouch-core — typecheck + test
        run: bun run typecheck && bun test
        working-directory: vouch-core
      - name: vouch-world — typecheck + test
        run: bun run typecheck && bun test
        working-directory: vouch-world
      - name: vouch-node — typecheck + test
        run: bun run typecheck && bun test
        working-directory: vouch-node
      - name: vouch-mcp — typecheck + test
        run: bun run typecheck && bun test
        working-directory: vouch-mcp
      - name: vouch-cli — typecheck + test
        run: bun run typecheck && bun test
        working-directory: vouch-cli
      - name: vouch-web — typecheck + test
        run: bun run typecheck && bun test
        working-directory: vouch-web

  # Lint the read-only observation OpenAPI spec (vouch-world/openapi/read.yaml)
  # against the Redocly ruleset in vouch-world/redocly.yaml. Additive job; does
  # not touch `test`.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: redocly lint
        run: sh vouch-world/openapi/lint.sh

  # Build the deployable image AND BOOT IT. Building alone proves nothing: a broken
  # install order produces an image that builds cleanly and then dies at startup on a
  # missing dependency, which is exactly how that defect reached main unnoticed.
  # Credential-free — no registry, no cloud identity; the image is built and discarded.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Build the image
        run: docker build -t vouch-node:ci .

      - name: Boot it and check the read + write surfaces
        run: |
          docker run -d --name vouch-ci -p 127.0.0.1:8787:8787 \
            -e VOUCH_NOTARY=env://VOUCH_NOTARY_SECRET \
            -e VOUCH_NOTARY_SECRET="ci-throwaway-$GITHUB_RUN_ID" \
            vouch-node:ci
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:8787/health >/dev/null 2>&1 && break
            sleep 1
          done
          docker logs vouch-ci
          sh deploy/smoke.sh http://127.0.0.1:8787

      - name: SIGTERM must be a graceful exit 0, not a kill
        run: |
          docker stop -t 15 vouch-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' vouch-ci)
          echo "exit code: $code"
          [ "$code" = "0" ] || { echo "expected a graceful exit 0, got $code"; exit 1; }
