# Ports are published to LOOPBACK ONLY. Docker inserts its published-port rules into
# iptables ahead of most host firewalls, so "8787:8787" would make the origin answer on
# 8787 directly on the public IP — bypassing the host firewall and defeating any
# reverse-proxy/CDN in front. Put a proxy on the host and point it at 127.0.0.1:8787.
services:
  vouch-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vouch-node
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - VOUCH_HOST=0.0.0.0
      - VOUCH_PORT=8787
      # REQUIRED, and deliberately WITHOUT a default: config.ts throws on a missing
      # VOUCH_NOTARY so a node can never boot on a predictable key. A default here would
      # reintroduce exactly that — and since the keypair is keyPairFromSeed(sha256(secret)),
      # a well-known string means anyone can forge notary-signed receipts.
      #   export VOUCH_NOTARY=env://VOUCH_NOTARY_SECRET
      #   export VOUCH_NOTARY_SECRET="$(openssl rand -base64 48)"
      - VOUCH_NOTARY=${VOUCH_NOTARY:?set VOUCH_NOTARY (e.g. env://VOUCH_NOTARY_SECRET) — there is no default}
      - VOUCH_NOTARY_SECRET=${VOUCH_NOTARY_SECRET:-}
      - VOUCH_JOURNAL=/app/data/journal.jsonl
      - VOUCH_ACCOUNTS=/app/data/accounts.jsonl
    volumes:
      - vouch-data:/app/data
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — busybox tries [::1] first and the node binds IPv4 only.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Development service with hot reload (docker compose --profile dev up vouch-node-dev)
  vouch-node-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vouch-node-dev
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - VOUCH_HOST=0.0.0.0
      - VOUCH_PORT=8787
      # Same rule as the production service: no default, not even for dev. A dev default
      # is how a well-known key reaches production.
      - VOUCH_NOTARY=${VOUCH_NOTARY:?set VOUCH_NOTARY (e.g. env://VOUCH_NOTARY_SECRET) — there is no default}
      - VOUCH_NOTARY_SECRET=${VOUCH_NOTARY_SECRET:-}
      - VOUCH_JOURNAL=/app/data/journal.jsonl
      - VOUCH_ACCOUNTS=/app/data/accounts.jsonl
    volumes:
      - ./vouch-node/src:/app/vouch-node/src:ro
      - vouch-dev-data:/app/data
    profiles:
      - dev

volumes:
  vouch-data:
  vouch-dev-data:
